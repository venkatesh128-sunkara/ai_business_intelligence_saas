name: ai-business-intelligence-saas

databases:
  - name: insightiq-db
    plan: free

services:
  # FastAPI backend
  - type: web
    name: insightiq-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insightiq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/storage
      - key: ADMIN_EMAIL
        value: admin@insightiq.dev
      - key: ADMIN_PASSWORD
        value: admin123

  # React frontend (nginx) proxying /api -> backend
  - type: web
    name: insightiq-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          name: insightiq-backend
          type: web
          property: url
